name: Release Obsidian plugin

# Cut a release by tagging the commit with the plugin version (no "v" prefix, per Obsidian convention):
#   cd packages/obsidian-plugin && npm version 0.2.0   # bumps package.json, manifest.json, versions.json
#   git push && git push --tags
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Check tag matches manifest version
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version="$(node -p "require('./packages/obsidian-plugin/manifest.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "Tag $tag does not match manifest.json version $version" >&2
            exit 1
          fi

      - run: npm test
      - run: npm run typecheck
      - run: npm run build --workspace packages/obsidian-plugin

      - name: Create GitHub release with plugin files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          cd packages/obsidian-plugin
          gh release create "$tag" \
            --title "$tag" \
            --generate-notes \
            main.js manifest.json styles.css
